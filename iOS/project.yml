# The iOS app's Xcode project, generated by XcodeGen:
#   cd iOS && xcodegen generate
# Listful.xcodeproj is generated, not checked in. ListfulCore (shared with
# the Mac app) comes from the package at the repo root.
name: Listful
options:
  bundleIdPrefix: com.chrispinnock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ListfulCore:
    path: ..
targets:
  Listful iOS:
    type: application
    platform: iOS
    sources:
      - Listful
    dependencies:
      - package: ListfulCore
        product: ListfulCore
    settings:
      base:
        PRODUCT_NAME: Listful
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispinnock.listful
        DEVELOPMENT_TEAM: CP8YGC8C4P
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Listful
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
