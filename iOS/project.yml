# The iOS app's Xcode project, generated by XcodeGen:
#   cd iOS && xcodegen generate
# Listful.xcodeproj is generated, not checked in. ListfulCore (shared with
# the Mac app) comes from the package at the repo root.
name: Listful
options:
  bundleIdPrefix: com.chrispinnock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ListfulCore:
    path: ..
targets:
  Listful iOS:
    type: application
    platform: iOS
    sources:
      - Listful
    dependencies:
      - package: ListfulCore
        product: ListfulCore
    # iCloud Drive › Listful: the app's own iCloud Documents container, public
    # so it shows in Files and Finder. Bump CURRENT_PROJECT_VERSION when
    # NSUbiquitousContainers changes, or iCloud Drive won't notice.
    entitlements:
      path: Listful/Listful.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.chrispinnock.listful]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.chrispinnock.listful]
    info:
      path: Listful/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's own HTTPS/file encryption: no export paperwork per upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSUbiquitousContainers:
          iCloud.com.chrispinnock.listful:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Listful
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_NAME: Listful
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispinnock.listful
        DEVELOPMENT_TEAM: CP8YGC8C4P
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        # scripts/release-ios passes the git commit count instead, so every
        # upload's build number is higher than the last.
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Listful
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
  Listful iOS UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ListfulUITests
    dependencies:
      - target: Listful iOS
    settings:
      base:
        DEVELOPMENT_TEAM: CP8YGC8C4P
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Listful iOS
schemes:
  Listful iOS:
    build:
      targets:
        Listful iOS: all
    test:
      targets:
        - Listful iOS UITests
